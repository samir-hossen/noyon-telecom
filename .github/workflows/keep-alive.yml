name: Keep backend awake

# Render's free plan puts the backend web service to sleep after ~15 minutes
# with no traffic; the next real visitor then has to wait 30-60+ seconds for
# it to wake up before any product data loads. Pinging /health well inside
# that 15-minute window keeps the service counted as "active" so it never
# goes to sleep in the first place. This is a free workaround, not a real
# fix — it can't help the very first request after a genuine cold start
# (e.g. right after a deploy), and it does nothing for login/checkout/admin
# requests, which aren't hit by this ping. The actual fix is upgrading the
# Render backend to a paid plan (no sleep, guaranteed).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://noyon-telecom-api.onrender.com/health
