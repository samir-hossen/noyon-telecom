<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2">
  <title id="t2">Mobile phone batteries stacked for wholesale</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e60023" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e60023" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cellA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#20232a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg2)"/>
  <circle cx="220" cy="150" r="340" fill="url(#glow2)"/>
  <rect x="0" y="720" width="1200" height="180" fill="#111318"/>
  <rect x="0" y="720" width="1200" height="6" fill="#e60023" opacity="0.55"/>

  <!-- crate outline -->
  <g stroke="#3a3f4a" stroke-width="4" fill="none" opacity="0.6">
    <rect x="700" y="560" width="420" height="200" rx="10"/>
    <line x1="700" y1="620" x2="1120" y2="620"/>
    <line x1="780" y1="560" x2="780" y2="760"/>
    <line x1="1040" y1="560" x2="1040" y2="760"/>
  </g>

  <!-- battery cell component (definition only, placed via <use> below) -->
  <defs>
    <g id="cell">
      <rect x="0" y="0" width="180" height="100" rx="14" fill="url(#cellA)" stroke="#4a4f5c" stroke-width="2"/>
      <rect x="14" y="14" width="152" height="72" rx="6" fill="#14161a"/>
      <rect x="150" y="34" width="16" height="32" rx="4" fill="#e60023"/>
      <path d="M40 30 l-14 20 h12 l-14 20" stroke="#e6a800" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="58" font-family="Arial, sans-serif" font-size="16" fill="#9aa0ac" font-weight="700">3.85V</text>
    </g>
  </defs>

  <!-- stacked grid of battery cells -->
  <use href="#cell" x="120" y="230"/>
  <use href="#cell" x="330" y="230"/>
  <use href="#cell" x="120" y="360"/>
  <use href="#cell" x="330" y="360"/>
  <use href="#cell" x="120" y="490"/>
  <use href="#cell" x="330" y="490"/>

  <!-- larger featured cell, angled -->
  <g transform="translate(640,240) rotate(-5)">
    <rect x="0" y="0" width="300" height="170" rx="20" fill="url(#cellA)" stroke="#e60023" stroke-width="3"/>
    <rect x="20" y="20" width="260" height="130" rx="10" fill="#14161a"/>
    <rect x="250" y="55" width="26" height="60" rx="6" fill="#e60023"/>
    <path d="M70 55 l-24 34 h20 l-24 34" stroke="#e6a800" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="100" font-family="Arial, sans-serif" font-size="26" fill="#c7cad2" font-weight="700">Li-Po</text>
  </g>

  <!-- MOQ / bulk box icon -->
  <g transform="translate(850,150)">
    <rect x="0" y="0" width="140" height="110" rx="10" fill="#181a1f" stroke="#3a3f4a" stroke-width="3"/>
    <path d="M0 34 L70 0 L140 34" fill="none" stroke="#3a3f4a" stroke-width="3"/>
    <path d="M0 34 L70 66 L140 34" fill="none" stroke="#e60023" stroke-width="3"/>
    <line x1="70" y1="66" x2="70" y2="110" stroke="#3a3f4a" stroke-width="3"/>
  </g>
</svg>
