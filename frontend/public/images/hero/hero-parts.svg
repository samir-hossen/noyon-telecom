<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
  <title id="t1">Mobile phone display and spare parts on a workbench</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="scr1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e60023" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e60023" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg1)"/>
  <circle cx="980" cy="180" r="360" fill="url(#glow1)"/>

  <!-- workbench surface -->
  <rect x="0" y="700" width="1200" height="200" fill="#111318"/>
  <rect x="0" y="700" width="1200" height="6" fill="#e60023" opacity="0.55"/>

  <!-- grid dots texture -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="120" cy="120" r="3"/><circle cx="220" cy="120" r="3"/><circle cx="320" cy="120" r="3"/>
    <circle cx="120" cy="220" r="3"/><circle cx="220" cy="220" r="3"/><circle cx="320" cy="220" r="3"/>
    <circle cx="120" cy="320" r="3"/><circle cx="220" cy="320" r="3"/><circle cx="320" cy="320" r="3"/>
  </g>

  <!-- main phone display panel, angled -->
  <g transform="translate(560,150) rotate(-6)">
    <rect x="0" y="0" width="330" height="560" rx="34" fill="#0e0f12" stroke="#3a3f4a" stroke-width="4"/>
    <rect x="14" y="14" width="302" height="532" rx="22" fill="url(#scr1)"/>
    <rect x="14" y="14" width="302" height="532" rx="22" fill="none" stroke="#e60023" stroke-width="2" opacity="0.5"/>
    <rect x="130" y="30" width="70" height="10" rx="5" fill="#0c0d10"/>
    <circle cx="165" cy="80" r="7" fill="#0c0d10"/>
    <!-- flex cable detail -->
    <path d="M60 420 q0 60 60 60 h140" stroke="#e60023" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="260" cy="480" r="10" fill="#e60023" opacity="0.7"/>
  </g>

  <!-- floating small back-glass panel -->
  <g transform="translate(230,320) rotate(8)">
    <rect x="0" y="0" width="220" height="380" rx="26" fill="#181a1f" stroke="#e60023" stroke-width="3" opacity="0.9"/>
    <circle cx="60" cy="60" r="20" fill="#25282f"/>
    <circle cx="60" cy="60" r="12" fill="#0c0d10"/>
    <rect x="30" y="120" width="160" height="4" fill="#3a3f4a"/>
    <rect x="30" y="140" width="110" height="4" fill="#3a3f4a"/>
  </g>

  <!-- screwdriver / repair tool -->
  <g transform="translate(870,470) rotate(38)">
    <rect x="0" y="0" width="18" height="150" rx="6" fill="#5b6070"/>
    <rect x="-8" y="140" width="34" height="70" rx="10" fill="#e60023"/>
  </g>

  <!-- floating screws -->
  <g fill="#7d8291">
    <circle cx="470" cy="700" r="10"/>
    <circle cx="500" cy="712" r="10"/>
    <circle cx="530" cy="700" r="10"/>
  </g>

  <!-- camera module chip -->
  <g transform="translate(160,600)">
    <rect x="0" y="0" width="110" height="110" rx="18" fill="#181a1f" stroke="#3a3f4a" stroke-width="3"/>
    <circle cx="55" cy="55" r="34" fill="#0c0d10" stroke="#e60023" stroke-width="3"/>
    <circle cx="55" cy="55" r="14" fill="#2a2d34"/>
  </g>
</svg>
