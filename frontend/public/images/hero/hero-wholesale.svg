<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4">
  <title id="t4">Boxed mobile phone spare parts ready for wholesale dispatch</title>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e60023" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e60023" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#20232a"/>
    </linearGradient>
    <g id="carton">
      <rect x="0" y="0" width="190" height="110" rx="10" fill="url(#box4)" stroke="#4a4f5c" stroke-width="2"/>
      <rect x="0" y="0" width="190" height="26" rx="10" fill="#2b2f37"/>
      <rect x="82" y="0" width="26" height="110" fill="#e60023" opacity="0.75"/>
      <rect x="16" y="46" width="52" height="40" rx="4" fill="#14161a" stroke="#4a4f5c" stroke-width="2"/>
      <rect x="124" y="46" width="50" height="8" rx="3" fill="#9aa0ac" opacity="0.6"/>
      <rect x="124" y="62" width="36" height="8" rx="3" fill="#9aa0ac" opacity="0.4"/>
      <rect x="124" y="78" width="44" height="8" rx="3" fill="#9aa0ac" opacity="0.4"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>
  <circle cx="220" cy="150" r="340" fill="url(#glow4)"/>
  <rect x="0" y="720" width="1200" height="180" fill="#111318"/>
  <rect x="0" y="720" width="1200" height="6" fill="#e60023" opacity="0.55"/>

  <!-- pallet -->
  <g stroke="#3a3f4a" stroke-width="4" fill="none" opacity="0.6">
    <rect x="90" y="650" width="480" height="40" rx="6"/>
    <line x1="170" y1="650" x2="170" y2="690"/>
    <line x1="330" y1="650" x2="330" y2="690"/>
    <line x1="490" y1="650" x2="490" y2="690"/>
  </g>

  <!-- stacked cartons -->
  <use href="#carton" x="110" y="530"/>
  <use href="#carton" x="320" y="530"/>
  <use href="#carton" x="110" y="410"/>
  <use href="#carton" x="320" y="410"/>
  <use href="#carton" x="215" y="290"/>

  <!-- featured replacement display panel, angled -->
  <g transform="translate(700,200) rotate(-6)">
    <rect x="0" y="0" width="230" height="430" rx="30" fill="#14161a" stroke="#e60023" stroke-width="3"/>
    <rect x="16" y="22" width="198" height="386" rx="18" fill="#1f232b"/>
    <circle cx="115" cy="44" r="7" fill="#3a3f4a"/>
    <path d="M40 110 L190 300" stroke="#9aa0ac" stroke-width="3" opacity="0.18"/>
    <path d="M40 170 L150 330" stroke="#9aa0ac" stroke-width="3" opacity="0.12"/>
    <!-- flex cable -->
    <path d="M115 430 v40 q0 16 16 16 h70" fill="none" stroke="#e6a800" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- MOQ / bulk box icon -->
  <g transform="translate(960,560)">
    <rect x="0" y="0" width="140" height="110" rx="10" fill="#181a1f" stroke="#3a3f4a" stroke-width="3"/>
    <path d="M0 34 L70 0 L140 34" fill="none" stroke="#3a3f4a" stroke-width="3"/>
    <path d="M0 34 L70 66 L140 34" fill="none" stroke="#e60023" stroke-width="3"/>
    <line x1="70" y1="66" x2="70" y2="110" stroke="#3a3f4a" stroke-width="3"/>
  </g>
</svg>
