<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e60023" />

    <!-- English (owner's language rule, Oct 2026) and kept identical to
         Home.jsx's usePageMeta call — this static tag is what a crawler that
         doesn't execute JS (WhatsApp/Facebook link previews) sees. -->
    <title>Wholesale Mobile Phone Spare Parts in Bangladesh — Noyon Telecom</title>
    <meta
      name="description"
      content="Wholesale mobile phone spare parts for repair shops and dealers in Bangladesh — displays, back glass, charging logic, SIM trays and more. Pre-tested, fast delivery."
    />
    <meta name="robots" content="index, follow" />
    <!-- No canonical here on purpose: this same file is served for every
         route (client-rendered SPA on static hosting — see render.yaml's
         SPA catch-all rewrite), so a hardcoded canonical here would be
         wrong for every page except "/" the moment a crawler reads the raw
         HTML before JS runs. usePageMeta (hooks/usePageTitle.js) sets the
         real, correct canonical for every page once React mounts,
         including this one (Home.jsx's own usePageMeta call correctly
         self-canonicalizes to "/"). Leaving this tag out entirely is a
         better signal than an actively wrong one — Google explicitly
         tolerates a missing canonical (it infers self-canonical) far
         better than a contradicting one. -->

    <!-- Start the first hero image before React downloads and renders. -->
    <link rel="preload" as="image" href="/images/hero/hero-parts.webp"
      imagesrcset="/images/hero/hero-parts-sm.webp 700w, /images/hero/hero-parts.webp 1400w"
      imagesizes="(max-width: 900px) 100vw, 600px" fetchpriority="high" />
    <link rel="preconnect" href="https://api.noyontelecom.com" crossorigin />
    <!-- Product photography is served from Cloudinary. Open its connection
         during HTML parsing so the first visible card does not pay DNS/TLS
         setup after product JSON arrives. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noyon Telecom" />

    <!-- Open Graph / social share preview (default; overridden per-page by usePageMeta) -->
    <meta property="og:site_name" content="Noyon Telecom" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wholesale Mobile Phone Spare Parts in Bangladesh — Noyon Telecom" />
    <meta
      property="og:description"
      content="Wholesale mobile phone spare parts for repair shops and dealers in Bangladesh — displays, back glass, charging logic, SIM trays and more. Pre-tested, fast delivery."
    />
    <!-- No og:url here on purpose, same reasoning as the missing canonical
         above — a hardcoded homepage URL would be wrong for every other
         page's share preview (e.g. WhatsApp showing the homepage when
         someone shares a product link) if a non-JS scraper reads this
         before usePageMeta sets the real one; most scrapers fall back to
         the actual fetched URL when og:url is absent, which is correct. -->
    <meta property="og:image" content="https://noyontelecom.com/logo-full.png" />
    <meta property="og:image:width" content="1210" />
    <meta property="og:image:height" content="690" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wholesale Mobile Phone Spare Parts in Bangladesh — Noyon Telecom" />
    <meta
      name="twitter:description"
      content="Wholesale mobile phone spare parts for repair shops and dealers in Bangladesh — displays, back glass, charging logic, SIM trays and more. Pre-tested, fast delivery."
    />
    <meta name="twitter:image" content="https://noyontelecom.com/logo-full.png" />

    <!-- Use the device's native UI font stack. This removes a render-blocking
         Google Fonts request and several font downloads from the critical
         path, while keeping the storefront crisp on every device. -->

    <!-- Store + WebSite structured data. sameAs below is hardcoded
         (this file is static, built once — it can't read the backend's
         SOCIAL_FACEBOOK_URL at request time the way Footer.jsx/Contact.jsx
         do via GET /api/settings/public); update it by hand here if that
         env var ever changes, or drop the sameAs line if the page is removed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "MobilePhoneStore"],
        "@id": "https://noyontelecom.com/#store",
        "name": "Noyon Telecom",
        "alternateName": "Noyon Telecom BD",
        "url": "https://noyontelecom.com",
        "logo": "https://noyontelecom.com/apple-touch-icon.png",
        "description": "Bangladesh's wholesale importer & distributor of mobile phone spare parts for dealers, shops and service centers.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4/181 (5th Floor), Gulistan Shopping Complex, 2 B.B Avenue, Gulistan",
          "addressLocality": "Dhaka",
          "postalCode": "1000",
          "addressCountry": "BD"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+880-1560-047377",
          "contactType": "customer service",
          "areaServed": "BD"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "10:00",
          "closes": "19:00"
        },
        "priceRange": "৳৳",
        "hasMerchantReturnPolicy": {
          "@type": "MerchantReturnPolicy",
          "applicableCountry": "BD",
          "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
          "merchantReturnDays": 7,
          "returnMethod": "https://schema.org/ReturnByMail",
          "returnFees": "https://schema.org/ReturnFeesCustomerResponsibility",
          "merchantReturnLink": "https://noyontelecom.com/refund-policy"
        },
        "sameAs": ["https://www.facebook.com/NoyonTelecomBD"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://noyontelecom.com/#website",
        "name": "Noyon Telecom",
        "url": "https://noyontelecom.com",
        "publisher": { "@id": "https://noyontelecom.com/#store" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://noyontelecom.com/shop?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
